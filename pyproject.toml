[project]
name = "dwg-convert"
version = "0.1.0"
description = "DWG / DXF to 3D STEP converter with production line zone detection"
requires-python = ">=3.11"
dependencies = [
    "ezdxf>=1.3.0",
    "shapely>=2.0.0",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
]

[project.scripts]
dwg-convert = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv]
package = true
